<style>
:root{color-scheme:dark;--bg:#07100b;--fg:#d8f0de;--mut:#7fa88a;--acc:#4fcf6a;--card:#10241a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;font:15px system-ui,sans-serif;color:var(--fg);pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:baseline}
#name{font-weight:700;font-size:18px}
#g{color:var(--acc);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--card);margin-top:10px;overflow:hidden}
#fill{height:100%;width:0;background:var(--acc);transition:width .15s}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#hint{font:13px system-ui,sans-serif;color:var(--mut)}
button{pointer-events:auto;font:600 15px system-ui,sans-serif;color:var(--fg);background:var(--card);border:1px solid #1f4a33;border-radius:12px;padding:12px 18px;width:100%;max-width:420px}
button:disabled{opacity:.45}
button:not(:disabled):active{background:#17382a}
#snd{position:fixed;right:14px;top:calc(52px + env(safe-area-inset-top,0px));width:auto;padding:6px 10px;font-size:16px;border-radius:10px}
#idleMaster{position:fixed;left:12px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:4;width:auto;max-width:none;padding:9px 13px;border-radius:999px;font-size:13px;box-shadow:0 3px 14px rgba(0,0,0,.45);background:#173b29;border-color:#4fcf6a}
#idleMaster.off{background:#2b2118;border-color:#a87845;color:#f2d3ad}
#idleMaster.partial{background:#25233a;border-color:#9b8cff;color:#ded8ff}
#idleMaster:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font:800 34px system-ui,sans-serif;color:var(--acc);opacity:0;transform:scale(.7);transition:all .25s;pointer-events:none;text-shadow:0 2px 12px #000}

function settleOperatingCosts(){
  const E=st.econ||(st.econ={arrears:0,missed:0,last:0}),cost=econDailyCost();
  if(cost<=0&&E.arrears<=0){E.last=0;E.missed=0;E.bankrupt=0;return}
  // A small late charge compounds only on unpaid operating bills; no hidden instant wipeout.
  const due=cost+Math.max(0,E.arrears)*1.015,paid=Math.min(Math.max(0,st.m),due);
  st.m=Math.max(0,st.m-paid);E.arrears=Math.max(0,Math.round((due-paid)*100)/100);E.last=cost;
  if(E.arrears>0.009){E.missed=(E.missed||0)+1;
    if(E.missed>=4){
      let ix=-1;for(let i=st.biz.length-1;i>=0;i--)if(st.biz[i]>0){ix=i;break}
      if(ix>=0){st.biz[ix]--;E.arrears=Math.round(E.arrears*.72*100)/100;chron('Insolvenz: '+BIZ[ix].n+' wurde zwangsweise geschlossen');toast('⚠️ Zahlungsunfähigkeit: '+BIZ[ix].n+' wurde geschlossen');}

        else if(st.law?.prop?.length){let j=0;for(let z=1;z<st.law.prop.length;z++)if(st.law.prop[z]<st.law.prop[j])j=z;st.law.prop.splice(j,1);E.arrears=Math.round(E.arrears*.7*100)/100;chron('Insolvenz: Immobilie wurde zwangsversteigert');toast('⚠️ Eine Immobilie wurde zwangsversteigert')}
        else{E.bankrupt=1;toast('⛔ Zahlungsunfähig: Investitionen sind gesperrt. Begleiche zuerst die Rückstände.');chron('Betrieb zahlungsunfähig – Investitionsstopp')}}
      E.missed=1;
    }else if(E.missed===1){toast('⚠️ Betriebskosten nicht vollständig bezahlt – Rückstand '+money(E.arrears));}
  }else{E.arrears=0;E.missed=0;E.bankrupt=0;}
}
function collectPassiveIncome(v){
  if(!(v>0)||!Number.isFinite(v))return 0;
  const E=st.econ||(st.econ={arrears:0,missed:0,last:0});
  // Während Zahlungsrückständen werden 35 % der passiven Einnahmen zur Sanierung einbehalten.
  const withheld=Math.min(Math.max(0,E.arrears||0),v*(E.arrears>0?.35:0));
  E.periodIncome=Math.max(0,+E.periodIncome||0)+v;
  E.periodWithheld=Math.max(0,+E.periodWithheld||0)+withheld;
  if(withheld>0){E.arrears=Math.max(0,Math.round((E.arrears-withheld)*100)/100);if(E.arrears<=.009){E.arrears=0;E.missed=0;E.bankrupt=0}}
  const net=Math.max(0,v-withheld);st.m+=net;st.life.earn+=v;track('earn',v);
  return net;
}

// Passive Betriebsumsätze sind unabhängig von Verkaufspreis-Perks; diese gelten nur für direkte Warenverkäufe.
const bizInc=()=>(BIZ.reduce((s,b,k)=>s+b.i*st.biz[k],0)+terrInc()+regInc())*(1+.04*allies());
// Passive Einnahmen folgen während des Offline-Catchups der virtuellen
 // Simulationsuhr. So werden sie nicht bereits im ersten Simulationsschritt
 // für den gesamten Abwesenheitszeitraum gutgeschrieben.
 const bizClock=()=>Date.now()+(OFFSIM?((st._offTick||0)-OFFLINE_SECONDS)*1000:0);
 // Online bleiben bis zu acht Stunden sammelbar; offline gilt höchstens die
 // tatsächlich simulierte Zeit (max. 40 Spieltage = 100 Minuten).
 const bizAcc=()=>{if(!st.bizT)return 0;const elapsed=Math.max(0,(bizClock()-st.bizT)/60000);return bizInc()*Math.min(OFFSIM?OFFLINE_SECONDS/60:480,elapsed)};
// Passive income is credited through one path so arrears garnishment is consistent.
const bizCost=k=>Math.round(BIZ[k].c*Math.pow(1.18,st.biz[k]));
const riskOf=r=>Math.max(.02,r.r-.01*st.sec-.0005*def()-.005*st.sk.l-.02*hasT('safe')-gb('s')-npcB('risk')-regB('r'));
const shipCap=()=>20+10*st.cap+5*st.sk.l,shipPcs=()=>Math.max(5,Math.round(shipCap()*.4)),un=k=>PROD[k]&&PROD[k].u||'g',gcap=()=>8+6*glvl()+2*st.sk.f;
function bestFlower(){let bk=null,bg=4.99;for(const k in st.inv){if(PROD[k])continue;if(st.inv[k].g>bg){bg=st.inv[k].g;bk=k}}return bk}
function sendShip(i){
  const r=ROUTES[i];
  if(st.m<r.c||st.lvl<r.lv||st.ships.length>=3){sfx.err();return}
  const it=Object.entries(st.inv).filter(([k,e])=>e.g>.05).sort((a,b)=>price(b[0])*b[1].q-price(a[0])*a[1].q);
  let lg=shipCap(),ls=shipPcs(),val=0;
  for(const[k,e]of it){const pc=un(k)==='Stk',t=Math.min(pc?ls:lg,e.g);if(t<=0)continue;val+=t*price(k)*priceDemand(k)*e.q;e.g-=t;if(pc)ls-=t;else lg-=t}
  if(val<=0){sfx.err();toast('Nichts zum Verschicken im Lager');return}
  heatAdd(2);
  st.m-=r.c;st.ships.push({r:i,end:Date.now()+r.t*1000,val:val*r.m*(st.mod==='t'?1.3:1),risk:riskOf(r)});sfx.buy();toast('Lieferung nach '+r.n+' unterwegs');
}
function attack(i){
  const g=st.gang,A=atk(),P=DIST[i].p*(1+.15*st.pr)+aiDef(i);
  if(A<=0||g.terr.includes(i)){sfx.err();return}attackHook(i);
  if(Math.random()*(A+P)<A*rnd(.85,1.15)){g.terr.push(i);g.rep+=Math.round(P/4);g.m.k=Math.floor(g.m.k*(1-rnd(.08,.15)));sfx.up();toast('Sieg! '+DIST[i].n+' gehört jetzt dir');track('terr',1)}
  else{g.m.k=Math.floor(g.m.k*(1-rnd(.25,.4)));sfx.err();toast('Angriff auf '+DIST[i].n+' gescheitert – Verluste')}
}
function raid(){
  const g=st.gang,i=g.terr[(Math.random()*g.terr.length)|0],P=DIST[i].p*rnd(.7,1.3)*(1+.15*st.pr),D=def()*rnd(.8,1.2),ai=raidFac(),r=RIV[ai];
  if(ai<0){toast('Deine Verbündeten halten die Rivalen zurück');save();ui();return}
  if(D>=P*facMul(ai)*aiRaidMul(ai)*.9){g.rep+=Math.round(P/8);toast(r+' griff '+DIST[i].n+' an – abgewehrt!');sfx.done()}
  else{g.terr.splice(g.terr.indexOf(i),1);st.fo[i]=ai;toast(r+' hat '+DIST[i].n+' übernommen!');sfx.err()}
  save();ui();
}

// Idle layer: routine, already-funded production steps continue without minigame input.
// Harvesting is automatic only once a plant is mature; it never spends resources or plants seeds.
let OFFSIM=false, SIM_CATCHUP=false;
function idleAutoTick(){
  const g=st.gr,auto=st.auto||(st.auto={plant:true,water:true,heal:true,trim:true,proc:true,sell:true,pack:true,packSell:true,biz:true,supplies:true});
  // Migration safety: older saves can own businesses without a payout timestamp.
  // Start their passive-income clock instead of leaving automatic collection disabled forever.
  if(auto.biz&&!st.bizT&&bizInc()>0)st.bizT=Date.now();
  // Passive businesses pay into the wallet automatically once per minute.
  // bizAcc keeps the existing eight-hour cap, so this does not create unlimited offline money.
  if(auto.biz&&st.bizT&&bizClock()-st.bizT>=60000){
    const income=bizAcc();
    if(income>0){collectPassiveIncome(income);st.bizT=bizClock();}
  }
  // Automatic crop care, harvesting and replanting use only supplies already in stock.
  for(let i=0;i<g.pl.length;i++){
    const p=g.pl[i];
    if(p){
      if(auto.water&&p.w<72)gWater(i,true);
      if(auto.heal&&p.d&&g.ps>0){g.ps--;p.d=0;p.dn=0;}
      if(p.t>=p.T*.95)harvest(i);
    }
  }
  if(auto.plant&&st.lvl>=2){
    for(let i=0;i<gSlots();i++)if(!g.pl[i]){
      const k=Object.keys(g.sd).find(x=>g.sd[x]>0&&STRAINS[+x]&&STRAINS[+x].min<=st.lvl);
      if(k&&g.so[g.sub]>0)plant(i,+k);
    }
  }
  // Automated trimming converts harvested raw material into the same inventory
  // used by the existing customer/production economy, without launching the scissors game.
  if(auto.trim){
    for(const key of Object.keys(g.raw)){
      const rw=g.raw[key];if(!rw||rw.g<.3||!STRAINS[+key]||STRAINS[+key].min>st.lvl)continue;
      const batches=Math.min(4,Math.floor(rw.g/1.5));if(!batches)continue;
      const used=batches*1.5,base=(1.2+8*.12)*STRAINS[+key].yf*mulY();
      const out=base*batches*(1+.6);
      const q=clamp((1.2+.03*st.sk.c+.02*st.bld.dry+gb('q'))*(.5+.5*rw.q),.6,1.5);
      const e=st.inv[key]||{g:0,q};e.q=(e.q*e.g+q*out)/(e.g+out);e.g+=out;st.inv[key]=e;
      rw.g-=used;if(rw.g<.05)delete g.raw[key];
      st.life.trim=(st.life.trim||0)+batches;track('trim',batches);addXP(5*batches);
    }
  }
  // Owned lab machines automatically start funded batches while capacity is available.
  if(auto.proc&&st.mach&&st.mach.length){
    const cap=2+Math.floor(st.lab/2);
    for(const k of st.mach){
      if(st.jobs.length>=cap)break;
      if(!PROD[k]||st.lvl<PROD[k].lv)continue;
      const bk=bestFlower(),e=bk!==null&&st.inv[bk];
      if(!e||e.g<5)break;
      e.g-=5;
      st.jobs.push({k,out:5*PROD[k].r*rnd(.9,1.15),q:e.q*(1+.02*st.lab+.04*st.sk.c),
        end:(Date.now()+(OFFSIM?((st._offTick||0)-OFFLINE_SECONDS)*1000:0))+30000/(1+.3*st.lab+.05*st.sk.t+npcB('lab'))});
    }
  }
  // Packing is performed only by an owned robot/paid packer (packBot), never for free.
  // Customer fulfillment prefers finished matching packs; loose goods are the fallback.
  if(auto.sell&&cust.length){
    for(let i=cust.length-1;i>=0;i--){
      const c=cust[i];if(!c||c.pack)continue;
      let sold=false;
      if(auto.packSell&&typeof packPlan==='function'&&!PROD[c.i]){
        const plan=packPlan(c);
        if(plan){
          let total=0;
          for(const [f,n] of plan){total+=n*f.s*price(c.i)*priceDemand(c.i)*c.m*f.q*packMul(f);f.n-=n;}
          pkClean();st.m+=total;st.life.earn+=total;st.life.sold+=c.g;
          noteSale(c.i,c.g);regSale(c,false);cust.splice(i,1);
          track('sellg',c.g);track('earn',total);heatAdd(Math.min(1.2,.35+c.g/80));addXP(4);sold=true;
        }
      }
      if(sold)continue;
      // If the player enabled the full packing workflow, keep this order queued until
      // an exact matching pack is ready. Do not silently bypass the packer with loose sales.
      const hasPacker=!!(st.pk?.up?.rb||(st.pk?.cw&&st.pk?.up?.pc));
      if(auto.pack&&auto.packSell&&hasPacker&&!PROD[c.i])continue;
      const e=st.inv[c.i];if(!e||e.g+0.0001<c.g)continue;
      const used=c.g,total=used*price(c.i)*priceDemand(c.i)*c.m*e.q*.9;
      e.g-=used;st.m+=total;st.life.earn+=total;st.life.sold+=used;
      noteSale(c.i,used);regSale(c,true);cust.splice(i,1);
      track('sellg',used);track('earn',total);heatAdd(.8);addXP(5);
    }
  }
}
function secTick(){
  const now=Date.now()+(OFFSIM?((st._offTick||0)-OFFLINE_SECONDS)*1000:0),P=isPaused();let ch=false;
  custT+=1;mktT+=1;evTick(1,now);
  if(custT>Math.max(3,9-st.mkt*1.2)*aiPress()&&cust.length<3+st.cust){cust.push(newCust());custT=0;ch=true}
  if(mktT>=20){mktT=0;mk=mk.map(m=>clamp(m*(1+rnd(-.03,.03)),.7+.02*st.sk.a,1.5));for(const k in PROD)mkp[k]=clamp((mkp[k]||1)*(1+rnd(-.09,.09)),.7+.02*st.sk.a,1.5);ch=true}
  if(!OFFSIM){st.wsec=(st.wsec||0)+1;if(st.wsec>=AIDAY){st.wsec=0;aiDay();ch=true}}
  if(!P || OFFSIM){
    const beforeCust=cust.length,beforePacks=pkN(),beforeMoney=st.m,beforeJobs=st.jobs.length;
    heatTick();staffTick();growTick();staffGrow();packBot();idleAutoTick();
    if(cust.length!==beforeCust||pkN()!==beforePacks||st.m!==beforeMoney||st.jobs.length!==beforeJobs)ch=true;
    st.dsec=(st.dsec||0)+1;if(st.dsec>=150){st.dsec=0;newDay()}
  }
  for(let i=st.jobs.length-1;i>=0;i--){const j=st.jobs[i];if(j.end<=now){const e=st.inv[j.k]||{g:0,q:j.q};e.q=(e.q*e.g+j.q*j.out)/(e.g+j.out);e.g+=j.out;st.inv[j.k]=e;st.jobs.splice(i,1);if(!OFFSIM&&!SIM_CATCHUP){toast(PROD[j.k].n+' fertig: +'+j.out.toFixed(1));sfx.done()}track('proc',1);ch=true}}
  for(let i=st.ships.length-1;i>=0;i--){const s=st.ships[i];if(s.end<=now){st.ships.splice(i,1);ch=true;
    if(Math.random()<s.risk){if(!OFFSIM&&!SIM_CATCHUP){toast(RIV[gRand()]+' fing deine Lieferung nach '+ROUTES[s.r].n+' ab!');sfx.err()}}
    else{st.m+=s.val;st.life.earn+=s.val;if(!OFFSIM&&!SIM_CATCHUP){toast('Lieferung '+ROUTES[s.r].n+': +'+money(s.val));sfx.cash()}track('ship',1)}}}
  if(!P&&!SIM_CATCHUP&&st.gang.n&&st.gang.terr.length){raidT-=1;if(raidT<=0){raidT=rnd(260,480)*raidMul();raid()}}
  if(ch && !OFFSIM&&!SIM_CATCHUP){save();ui();if(SHEET.classList.contains('open')&&tab==='sell')renderSell()}
  if(OFFSIM)st._offTick=(st._offTick||0)+1;
  if(!OFFSIM&&!SIM_CATCHUP&&ch&&SHEET.classList.contains('open')){
    if(tab==='lab')renderLab();
    else if(tab==='trade')renderTrade();
    else if(tab==='pack'&&document.activeElement?.id!=='packSize')renderPack();
    else if(tab==='grow')renderGrow();
  }
}
function renderLab(){
  let h=dashHTML()+'<div class="h">Labor (Charge = 5 g Blüten)</div>'+card('<b>Eigene Produktentwicklung</b><small>Erstelle eine benannte Produktvariante auf Basis eines vorhandenen Laborverfahrens. Entwicklung kostet €5.000.</small>',btn('newRecipe',0,'Eigenes Rezept entwickeln',st.m<5000));
  const dur=30000/(1+.3*st.lab+.05*st.sk.t+npcB('lab'));
  st.jobs.forEach(j=>{const [ic,c]=pvOf(j.k),left=Math.max(0,j.end-Date.now()),pc=clamp(100-left/dur*100,0,100);
    h+=card(`<div class="ir"><span class="ic" style="background:${c}33;border-color:${c}">${ic}</span><div class="ib"><div class="it"><b>${PROD[j.k].n}</b><span>${Math.ceil(left/1000)} s</span></div><div class="lb"><i style="width:${pc}%;background:${c}"></i></div></div></div>`,'')});

function pkSane(){const P=st.pk;
  for(const u of PKUP)P.up[u.k]=clamp(Math.floor(P.up[u.k])||0,0,u.max);
  for(const k in PKM)P.mt[k]=Math.max(0,Math.floor(P.mt[k])||0);
  P.lb=Math.max(0,Math.floor(P.lb)||0);P.rt=0;
  if(P.pend){const d=P.pend;P.pend=null;if(isO(d)&&STRAINS[d.k]&&PKM[d.m]&&PKS.includes(d.s)&&isFinite(d.q)&&isFinite(d.w)){pkAdd(d.k,d.s,d.m,clamp(d.q,.5,3),clamp(.5*d.w+.25*.5+.25*.5,0,1));toast('📦 Angefangene Packung wurde fertiggestellt')}}
  if(!validPackSize(P.size))P.size=3.5;if(!PKM[P.mat])P.mat='b';
  if(P.sel!=null&&!STRAINS[P.sel])P.sel=null;P.order=!!P.order;
  if(P.au&&(!isO(P.au)||!STRAINS[P.au.k]||!PKM[P.au.m]||!validPackSize(P.au.s)))P.au=null;
  for(const key in P.fin){const f=P.fin[key];
    if(!isO(f)||!STRAINS[f.k]||!PKM[f.m]||!validPackSize(f.s)||!(f.n>0)||!isFinite(f.q)||!isFinite(f.pq)||key!==f.k+'|'+f.s+'|'+f.m)delete P.fin[key];

function pkAdd(k,s,m,q,pq){const key=k+'|'+s+'|'+m,f=st.pk.fin[key]||{k:+k,s,m,n:0,q,pq};
  f.q=(f.q*f.n+q)/(f.n+1);f.pq=(f.pq*f.n+pq)/(f.n+1);f.n++;st.pk.fin[key]=f}
function packPlan(c){
  if(!c||PROD[c.i]||!(c.g>0))return null;
  const target=Math.round(c.g*10);
  if(target<5||target>140)return null;
  const L=Object.values(st.pk.fin).filter(f=>f.n>0&&f.k==c.i&&validPackSize(f.s));
  const dp=new Array(target+1).fill(null);dp[0]={prev:-1,idx:-1};
  // Bounded subset-sum: only exact totals are accepted, never oversized customer packs.
  for(let fi=0;fi<L.length;fi++){
    const f=L[fi],sz=Math.round(f.s*10),count=Math.min(f.n,Math.floor(target/sz));
    for(let n=0;n<count;n++){
      for(let sum=target;sum>=sz;sum--){
        if(dp[sum]===null&&dp[sum-sz]!==null)dp[sum]={prev:sum-sz,idx:fi};
      }
    }
  }
  if(dp[target]===null)return null;
  const counts=new Map();let sum=target;
  while(sum>0){const node=dp[sum];if(!node)return null;counts.set(node.idx,(counts.get(node.idx)||0)+1);sum=node.prev}
  return [...counts.entries()].map(([i,n])=>[L[i],n]);
}

    const amount=Math.round(c.g*10)/10,e=st.inv[c.i];

    }

  }

function packBot(dt=1){
  const P=st.pk,rb=P.up.rb||0,pc=P.cw?P.up.pc:0;
  if((!rb&&!pc)||!st.auto?.pack)return 0;
  // The saved timer makes the robot respect its actual production speed, including offline time.
  P.rt=(P.rt||0)+dt;
  const interval=botSec();
  let made=0,cycles=0;
  while(P.rt>=interval&&cycles<4){
    P.rt-=interval;cycles++;
    // Higher robot levels and a staffed packer increase throughput per production cycle.
    const batches=(rb?1+Math.floor((rb-1)/2):0)+pc;
    let cycleMade=0;
    for(let n=0;n<batches;n++){
      if(!autoPackOne())break;
      cycleMade++;made++;

    if(!cycleMade){P.rt=0;break;}
  }
  return made;

function packAct(a,raw){const P=st.pk;

    case 'p_order':{const c=cust[+raw];if(c&&!c.pack&&!PROD[c.i]&&STRAINS[c.i]){P.sel=String(c.i);P.size=Math.round(c.g*10)/10;P.order=true;const m=['b','d','g'].find(k=>P.mt[k]>0);if(m)P.mat=m;}break}

  }
  if(sh>.01){
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=Math.min(1,.32*sh);ctx.drawImage(glowSprite(),cx-R*1.5,cy-R*1.5,R*3,R*3);ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';bud.shine*=.95;
  }
  ctx.restore();
  // fallende Stücke
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];
    p.vy=Math.min(p.vy+800*dt,420);p.vx*=1-1.2*dt;
    p.cx+=p.vx*dt;p.cy+=p.vy*dt;
    p.ang+=(p.vr+Math.sin(time*7+p.ph)*2)*dt;

    p.vy+=90*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;

  }

  comboT-=sdt;if(comboT<=0)combo=0;

    }
  }
  drawTrail(time);if(cursor&&!done)drawScissors();drawFloaters(dt);
  if(!done&&!exitAt){const f=clamp(1-(now-t0)/1000/parT,0,1);if(Math.abs(f-tbF)>.005){tbF=f;const tf=$('tfill');tf.style.transform='scaleX('+f.toFixed(3)+')';tf.classList.toggle('low',f<.25)}}
  requestAnimationFrame(frame);

  if(own.length>1){g.setLineDash([4,6]);g.lineWidth=1.2;g.strokeStyle='rgba(110,224,138,.28)';g.beginPath();                                        // Handelswege zwischen eigenen Gebieten
    for(const i of own){let b=-1,bd=9;for(const j of own){if(j===i)continue;const d=(mapPoly[i].c[0]-mapPoly[j].c[0])**2+(mapPoly[i].c[1]-mapPoly[j].c[1])**2;if(d<bd){bd=d;b=j}}
      if(b>=0){g.moveTo(mapPoly[i].c[0]*w,mapPoly[i].c[1]*h);g.lineTo(mapPoly[b].c[0]*w,mapPoly[b].c[1]*h)}}
    g.stroke();g.setLineDash([])}
  if(gfxL===2){g.shadowBlur=10;g.lineWidth=1.8;                                                                                                   // Leuchtkante eigener Gebiete
    for(const i of own){g.shadowColor=g.strokeStyle=mapCol(-1);g.globalAlpha=.8;path(mapPoly[i]);g.stroke()}
    if(mapSel>=0&&mapPoly[mapSel]){g.shadowColor=g.strokeStyle='#ffd34d';g.lineWidth=2.5;g.globalAlpha=1;path(mapPoly[mapSel]);g.stroke()}
    g.shadowBlur=0}
  g.globalAlpha=1;
  const sh=g.createLinearGradient(0,0,w,h);sh.addColorStop(0,'rgba(190,255,215,.07)');sh.addColorStop(.5,'rgba(190,255,215,0)');sh.addColorStop(1,'rgba(0,0,0,.14)');g.fillStyle=sh;g.fillRect(0,0,w,h);   // Glanz
  const vg=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.38,w/2,h/2,Math.max(w,h)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=vg;g.fillRect(0,0,w,h);   // Vignette
  g.strokeStyle='rgba(110,224,138,.35)';g.lineWidth=1.5;const m=7,k=14;g.beginPath();                                                              // Eckmarken
  for(const[x,y,a,b]of[[m,m,1,1],[w-m,m,-1,1],[m,h-m,1,-1],[w-m,h-m,-1,-1]]){g.moveTo(x,y+b*k);g.lineTo(x,y);g.lineTo(x+a*k,y)}g.stroke();
  g.fillStyle='rgba(190,255,215,.55)';g.font='700 10px system-ui,sans-serif';g.textAlign='center';g.fillText('N',w-18,24);g.beginPath();g.moveTo(w-18,10);g.lineTo(w-21,18);g.lineTo(w-15,18);g.closePath();g.fill();   // Nordpfeil
  g.restore()};
// Einstellung im Tab System
const _g8rs=renderSys;renderSys=function(){_g8rs();
  const L=['Aus','Reduziert','Voll'],b=[2,1,0].map(i=>btn('gfx',i,(gfxL===i?'● ':'')+L[i])).join('');
  $('list').insertAdjacentHTML('afterbegin','<div class="h">Grafik-Effekte</div><div class="card col"><small>Voll: Licht, Rauch, Karteneffekte · Reduziert: nur Oberflächen-Politur · Aus: spart Akku auf schwachen Geräten</small><div class="bt">'+b+'</div></div>')};
$('list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.dataset.a!=='gfx')return;
  const n=+b.dataset.i;if(!(n>=0&&n<=2)||n===gfxL)return;const was=gfxL;gfxL=n;lsSet('bt_gfx',String(n));gfxApply();

// ===== Phase 9: Balance-Pass 1.3 – nachvollziehbare, skalierende Polizei- und Rivalenrisiken =====
// Razzien bleiben relevant, sollen aber nicht mehrere große Verluste in kurzer Folge verursachen.
policeRaid=function(){
  const L=st.law||(st.law=lawNew());
  const heat=clamp(+st.heat||0,0,100);
  const skill=+st.sk?.l||0;
  const safe=hasT('safe')?1:0;
  const contacts=clamp((+L.cor||0)/100,0,1);
  const confiscate=clamp(.12+.0012*Math.max(0,heat-60)-.008*skill-.025*safe-.025*contacts,.08,.22);
  for(const k in st.inv)if(st.inv[k])st.inv[k].g*=1-confiscate;
  const severity=clamp(.7+heat/250+(+L.a||0)/400,.7,1.25);
  const fine=Math.min(st.m*(.035+.025*severity),120*st.lvl*st.lvl);
  st.m=Math.max(0,st.m-fine);
  st.heat=22;
  L.a=clamp((+L.a||0)+6,0,100);
  // Arrest is possible, but uncommon; strong loyalty can protect the crew.
  if(st.staff.length&&Math.random()<(.10+.12*(L.a/100))){
    const idx=st.staff.reduce((best,w,i,a)=>w.lo<a[best].lo?i:best,0);
    const w=st.staff.splice(idx,1)[0];
    L.arr.push({w,rel:st.day+3,bail:Math.round(180*st.lvl*(1+.2*(+w.s||1)))});
    toast('🚔 '+w.n+' wurde vorübergehend festgenommen');
    chron(w.n+' wurde bei einer Razzia vorübergehend festgenommen');
  }
  toast('🚨 Razzia! '+Math.round(confiscate*100)+' % Lager beschlagnahmt, Strafe '+money(fine));
  chron('Razzia: '+Math.round(confiscate*100)+' % Lager verloren, Strafe '+money(fine));
  sfx.err();save();ui();
};
// Kurze Schutzphase nach einer Razzia: die gleiche Hitze löst nicht sofort eine zweite aus.
const _balancedHeatTick=heatTick;
heatTick=function(){
  const before=+st.heat||0;
  _balancedHeatTick();
  if(before>60&&st.heat===22)st.heat=22;
};
// Im Fraktions-Tab wird das Risiko transparent erklärt, statt Razzien als Zufallsspitze erscheinen zu lassen.
const _balancedRenderLaw=renderLaw;
renderLaw=function(){
  _balancedRenderLaw();
  const el=$('list');
  if(el)el.insertAdjacentHTML('beforeend',
    '<div class="card col"><b>Risiko-Balance</b><small>Hitze sinkt mit der Zeit. Hohe Hitze und Ermittlungsdruck erhöhen das Razzia-Risiko; Kontakte, Sicherheits-Upgrades und Analyse verringern die Folgen. Nach einer Razzia fällt die Hitze deutlich ab. Rivalenangriffe kommen seltener und eine knappe Verteidigung kann dein Gebiet halten.</small></div>');
};

// 2.7: Offline-Zeitversatz nach jedem Catch-up verwerfen, damit keine alte Simulationszeit fortlebt.
// 2.9: Passive Einnahmen während Offline-Catchup an die virtuelle Simulationsuhr koppeln.
// 2.6: Offline-Einnahmen an den tatsächlich simulierten Zeitraum koppeln; Kassenreichweite anzeigen.
// 2.5: Tagesabschluss in einer konsistenten Reihenfolge. Erst Löhne/Tagesevents
// und Mieten verbuchen, dann Betriebskosten abrechnen; so passt die Prognose zum Cashflow.
const _accountedNewDay=newDay;
newDay=function(){
  const E=st.econ||(st.econ={arrears:0,missed:0,last:0,bankrupt:0});
  const cashBefore=st.m;
  E.periodIncome=0;E.periodWithheld=0;
  _accountedNewDay();
  settleOperatingCosts();
  E.lastIncome=Math.round((+E.periodIncome||0)*100)/100;
  E.lastWithheld=Math.round((+E.periodWithheld||0)*100)/100;
  E.lastCashDelta=Math.round((st.m-cashBefore)*100)/100;
  E.lastDay=st.day;
  E.periodIncome=0;E.periodWithheld=0;
  save();ui();
};

resize();addEventListener('resize',resize);
INIT=1;sane();aiInit();fillQuests();if(!st.cands.length)genCands();spawn(startStrain());
if(OFFLINE_SECONDS>0){
  // Der Zeitversatz gehört ausschließlich zu diesem Catch-up-Lauf. Ein alter
  // _offTick-Wert aus dem Save darf Jobs/Sendungen beim nächsten Start nicht vorspulen.
  st._offTick=0;
  OFFSIM=true;
  try{for(let t=0;t<OFFLINE_SECONDS;t++)secTick()}
  finally{OFFSIM=false;delete st._offTick}
  // Auch bei deaktivierter Auto-Abholung darf der manuelle Sammelknopf nach
  // langer Abwesenheit nicht mehr Einnahmen auszahlen als offline simuliert wurden.
  // Der Zeitstempel wird auf das Ende des tatsächlich simulierten Fensters begrenzt.
  if(st.bizT>0)st.bizT=Math.max(st.bizT,Date.now()-OFFLINE_SECONDS*1000);
  st.ts=Date.now();save();
  if(OFFLINE_SECONDS>=30)setTimeout(()=>toast('Idle-Fortschritt: '+Math.floor(OFFLINE_SECONDS/150)+' Spieltage offline simuliert'),900);
}
ui();setTimeout(()=>{const v=bizAcc();if(v>1)toast('Einnahmen warten: '+money(v)+' (Handel → Abholen)')},1200);
// Auch ältere Spielstände können den temporären Catch-up-Zähler enthalten.
delete st._offTick;
let simClock=Date.now(),simSaveAt=Date.now();
function pumpSimulation(){
  const now=Date.now();let steps=Math.floor((now-simClock)/1000);if(steps<=0)return;
  if(steps>40*150){const skipped=steps-40*150;simClock+=skipped*1000;steps=40*150;}
  SIM_CATCHUP=steps>2;
  for(let n=0;n<steps;n++){secTick();simClock+=1000;}
  SIM_CATCHUP=false;
  if(now-simSaveAt>=10000||steps>1){save();simSaveAt=now;}
  ui();
}
setInterval(pumpSimulation,250);setInterval(()=>{if(pid===null)later(save)},10000);addEventListener('visibilitychange',()=>{if(document.hidden)save();else pumpSimulation()});addEventListener('pagehide',save);
requestAnimationFrame(frame);
